name: folder_file_saver
description: Save files where users can find them. Images and videos go to the gallery (Android) or Photos (iOS), other files to a folder named after your app. Supports downloading from a URL and resizing images.
version: 3.1.0
homepage: https://github.com/bonamoogy/FolderFileSaver
repository: https://github.com/bonamoogy/FolderFileSaver
issue_tracker: https://github.com/bonamoogy/FolderFileSaver/issues
topics:
  - file
  - storage
  - download
  - gallery
  - photos

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aim.folder_file_saver
        pluginClass: FolderFileSaverPlugin
      ios:
        pluginClass: FolderFileSaverPlugin
